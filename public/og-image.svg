<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050510"/>
      <stop offset="1" stop-color="#0A0A1A"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#7C3AED" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Orbs -->
  <ellipse cx="200" cy="200" rx="300" ry="300" fill="url(#orb1)"/>
  <ellipse cx="1000" cy="450" rx="250" ry="250" fill="url(#orb2)"/>
  <!-- Logo icon -->
  <rect x="80" y="80" width="80" height="80" rx="18" fill="url(#g1)"/>
  <path d="M100 106L116 120L100 134" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M124 134H140" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Company name -->
  <text x="80" y="250" font-family="Inter,system-ui,sans-serif" font-size="72" font-weight="900" fill="url(#g1)">Shah Solutions</text>
  <text x="80" y="310" font-family="Inter,system-ui,sans-serif" font-size="28" fill="#94A3B8" letter-spacing="3">PREMIUM IT SERVICES</text>
  <!-- Services row -->
  <g font-family="Inter,system-ui,sans-serif" font-size="20" fill="#64748B">
    <text x="80" y="410">SEO Optimization</text>
    <text x="80" y="445">GEO / AI Search</text>
    <text x="340" y="410">Web Development</text>
    <text x="340" y="445">App Development</text>
    <text x="620" y="410">Digital Marketing</text>
    <text x="620" y="445">Cloud Solutions</text>
  </g>
  <!-- Divider -->
  <line x1="80" y1="475" x2="700" y2="475" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <!-- Contact -->
  <text x="80" y="510" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#7C3AED">amaherwani@gmail.com</text>
  <text x="80" y="545" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#64748B">0303 2818320 · Worldwide Delivery</text>
  <!-- Badge -->
  <rect x="860" y="260" width="260" height="100" rx="50" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="990" y="320" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">Pakistan's #1 IT Agency</text>
</svg>
